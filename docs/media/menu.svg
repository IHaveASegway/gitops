<text x="22.00px" y="53.90px" xml:space="preserve"/><text x="22.00px" y="70.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#5fffd7">  gitops</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="87.70px" xml:space="preserve"><tspan xml:space="preserve" fill="#606060">  ~/Documents/GitHub/acme · 5 repos · 3 dirty · 3 behind · 2 ahead</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="104.60px" xml:space="preserve"/><text x="22.00px" y="121.50px" xml:space="preserve"><tspan xml:space="preserve" fill="#5fffd7">  ▸ </tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#5fffd7">pull      </tspan><tspan xml:space="preserve"> </tspan><tspan xml:space="preserve" fill="#606060">Checkout default branch and pull latest</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="138.40px" xml:space="preserve"><tspan xml:space="preserve">    sync       </tspan><tspan xml:space="preserve" fill="#606060">Stash changes, pull default branch, restore stash</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="155.30px" xml:space="preserve"><tspan xml:space="preserve">    status     </tspan><tspan xml:space="preserve" fill="#606060">Branch, ahead/behind and working tree status</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="172.20px" xml:space="preserve"><tspan xml:space="preserve">    branch     </tspan><tspan xml:space="preserve" fill="#606060">Create a new branch from the default branch</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="189.10px" xml:space="preserve"><tspan xml:space="preserve">    checkout   </tspan><tspan xml:space="preserve" fill="#606060">Checkout an existing branch</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="206.00px" xml:space="preserve"><tspan xml:space="preserve">    push       </tspan><tspan xml:space="preserve" fill="#606060">Stage all, commit and push current branch</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#ffaf00">  !</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="222.90px" xml:space="preserve"><tspan xml:space="preserve">    reset      </tspan><tspan xml:space="preserve" fill="#606060">Discard ALL local changes, force checkout default, pull</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#ffaf00">  !</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="239.80px" xml:space="preserve"><tspan xml:space="preserve">    init       </tspan><tspan xml:space="preserve" fill="#606060">Clone every repo of a GitHub org into a subdirectory</tspan><tspan xml:space="preserve"/></text><text x="22.00px" y="256.70px" xml:space="preserve"/><text x="22.00px" y="273.60px" xml:space="preserve"/><text x="22.00px" y="290.50px" xml:space="preserve"><tspan xml:space="preserve" fill="#606060">  ↑/↓ move · enter select · r rescan · q quit</tspan><tspan xml:space="preserve"/></text>
