# GoReleaser configuration — https://goreleaser.com
version: 2

project_name: gitops

before:
  hooks:
    - go mod tidy

builds:
  - id: gitops
    main: ./cmd/gitops
    binary: gitops
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/IHaveASegway/gitops/internal/buildinfo.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The checksums file is signed keylessly with cosign (Sigstore) using the
# release workflow's OIDC identity, so tampering with any artifact is
# detectable. The workflow pins cosign to v2.x, whose sign-blob writes the
# .sig/.pem this config names. Verification instructions are in SECURITY.md.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - ${artifact}
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  prerelease: auto

# Homebrew: `brew install IHaveASegway/tap/gitops`. The formula is pushed to
# the tap on every release over SSH with the HOMEBREW_TAP_DEPLOY_KEY secret
# (a write-enabled deploy key that only works for the tap repository).
# Without the key the formula is only written to dist/, so the release still
# succeeds.
#
# A formula is used deliberately even though GoReleaser deprecated `brews`
# in favor of `homebrew_casks`: cask installs quarantine the downloaded
# binary, and shipping un-notarized binaries as a cask requires a post-
# install hook that strips com.apple.quarantine — disabling a Gatekeeper
# control on users' machines. Formula installs are not quarantined, so no
# security control has to be bypassed. Revisit if the binaries are ever
# notarized.
brews:
  - name: gitops
    repository:
      owner: IHaveASegway
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:IHaveASegway/homebrew-tap.git
        # Guarded so `make snapshot` works without the secret; skip_upload
        # below is already true whenever the key is absent, so the empty
        # value is never used to push.
        private_key: '{{ with index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}{{ . }}{{ end }}'
    directory: Formula
    commit_msg_template: "gitops {{ .Tag }}"
    homepage: https://github.com/IHaveASegway/gitops
    description: Mass git operations across many repos, with a TUI and one-command org cloning
    license: MIT
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}false{{ else }}true{{ end }}'
    test: |
      system "#{bin}/gitops", "--version"
