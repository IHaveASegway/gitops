name: Release

on:
  push:
    tags: ["v*"]

# contents: write publishes the release; id-token: write lets cosign sign
# the checksums keylessly against the workflow's OIDC identity.
permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # cosign-installer has no floating v4 major tag (only exact v4.x
      # releases), so this is pinned to an exact published version.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pin the cosign binary too: v3 changed sign-blob's default output
          # to a bundle and deprecated the --output-signature/--output-certificate
          # flags .goreleaser.yaml uses. Bump deliberately alongside those flags.
          cosign-release: v2.6.5
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pin the GoReleaser binary too, so this release-signing job is
          # fully reproducible; bump deliberately with Dependabot/manually.
          version: "2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
